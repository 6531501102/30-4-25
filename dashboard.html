
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
    }

    /* Sidebar */
    .sidebar {
      width: 220px;
      background-color: #7e6ccf;
      color: white;
      height: 100vh;
      position: fixed;
      top: 60px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      padding: 15px 20px;
      cursor: pointer;
      text-decoration: none;
      color: white;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .nav-item i {
      margin-right: 12px;
    }

    .nav-item:hover {
      background-color: #6b5bb5;
    }

    .nav-item.active {
      box-shadow: inset 5px 0 0 white;
      background-color: #6b5bb5;
      font-weight: bold;
    }

    /* Topbar */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background-color: #a89ee0;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 1000;
    }

    .top-left {
      display: flex;
      align-items: center;
    }

    .top-left img {
      height: 40px;
      margin-right: 10px;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .lang-toggle span {
      cursor: pointer;
      padding: 5px 10px;
      border-radius: 5px;
    }

    .lang-toggle .active {
      background-color: white;
      color: #7e6ccf;
      font-weight: bold;
    }

    .logout-button {
      background: transparent;
      border: 1px solid white;
      color: white;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .logout-button:hover {
      background-color: white;
      color: #7e6ccf;
    }

    /* Main content */
    .main-content {
      margin-left: 220px;
      margin-top: 60px;
      padding: 20px;
    }

    .content-wrapper {
      display: flex;
      gap: 20px;
    }

    .left-section {
      flex: 2;
    }

    .right-section {
      flex: 1;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .staff-item {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
    }

    .staff-item img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      margin-right: 15px;
    }

    .staff-item span {
      color: #f9c74f;
      font-weight: bold;
      margin-left: 5px;
    }

    canvas {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    select {
      padding: 6px 10px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <!-- Topbar -->
  <div class="topbar">
    <div class="top-left">
      <img src="https://upload.wikimedia.org/wikipedia/en/7/7e/Logo_of_Mae_Fah_Luang_University.svg" alt="Logo">
      <strong>REG.MFU</strong>
    </div>
    <div class="top-right">
      <div class="lang-toggle">
        <span id="lang-en" class="active">EN</span> /
        <span id="lang-th">TH</span>
      </div>
      <button class="logout-button" onclick="logout()">Logout</button>
    </div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">
    <a href="dashboard.html" class="nav-item active"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a href="management.html" class="nav-item"><i class="bi bi-people-fill"></i> Management</a>
    <a href="history.html" class="nav-item"><i class="bi bi-clock-history"></i> History</a>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div style="display: flex; justify-content: flex-start; align-items: center; margin-bottom: 20px;">
      
      <select id="semesterSelect">
        <option>Semester 1</option>
        <option>Semester 2</option>
        <option>Summer</option>
      </select>
    </div>

    <div class="content-wrapper">
      <!-- Left: Charts -->
      <div class="left-section">
        <h3 style="font-weight: bold; margin-bottom: 10px;">NUMBER OF WEEKLY USERS</h3>
        <canvas id="weeklyUsersChart" height="180"></canvas>

        <h3 style="font-weight: bold; margin: 20px 0 10px;">AVERAGE OVERALL RATING</h3>
        <canvas id="overallRatingChart" height="180"></canvas>
      </div>

      <!-- Right: Staff Ratings -->
      <div class="right-section">
        <div class="staff-item">
          <img src="https://via.placeholder.com/60">
          <a href="rating_porntip.html" style="text-decoration:none; color:inherit;"><strong>Porntip Panya</strong><br><i class="bi bi-star-fill"></i> <span>4.8</span></a>
        </div>
        <div class="staff-item">
          <img src="https://via.placeholder.com/60">
          <a href="rating_rattikarn.html" style="text-decoration:none; color:inherit;"><strong>Rattikarn Nanglae</strong><br><i class="bi bi-star-fill"></i> <span>4.7</span></a>
        </div>
        <div class="staff-item">
          <img src="https://via.placeholder.com/60">
          <a href="rating_sanyumporn.html" style="text-decoration:none; color:inherit;"><strong>Sanyumporn Chaichormphu</strong><br><i class="bi bi-star-fill"></i> <span>4.2</span></a>
        </div>
        <div class="staff-item">
          <img src="https://via.placeholder.com/60">
          <a href="rating_tatchamay.html" style="text-decoration:none; color:inherit;"><strong>Tatchamay Whanchisri</strong><br><i class="bi bi-star-fill"></i> <span>3.9</span></a>
        </div>
        <div class="staff-item">
          <img src="https://via.placeholder.com/60">
          <a href="rating_pakpoom.html" style="text-decoration:none; color:inherit;"><strong>Pakpoom Lamprasert</strong><br><i class="bi bi-star-fill"></i> <span>4.8</span></a>
        </div>
      </div>
    </div>
  </div>

  <script>
    function logout() {
      if (confirm("Are you sure you want to log out?")) {
        alert("Logged out successfully!");
      }
    }

    const ctx1 = document.getElementById('weeklyUsersChart').getContext('2d');
    const weeklyChart = new Chart(ctx1, {
      type: 'bar',
      data: {
        labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'],
        datasets: [
          { label: 'Appointment', backgroundColor: 'blue', data: [8, 5, 6, 9, 7] },
          { label: 'Document Tracking', backgroundColor: 'orange', data: [4, 3, 6, 5, 2] }
        ]
      },
      options: { responsive: true, scales: { y: { beginAtZero: true, max: 10 } } }
    });

    const ctx2 = document.getElementById('overallRatingChart').getContext('2d');
    const ratingChart = new Chart(ctx2, {
      type: 'bar',
      data: {
        labels: ['Fast Service', 'Helpful Staff', 'On Time'],
        datasets: [
          { label: 'Rating', data: [4.5, 4.3, 4.6], backgroundColor: ['blue', 'orange', 'red'] }
        ]
      },
      options: { responsive: true, scales: { y: { min: 0, max: 5 } } }
    });

    const weeklyUsersData = {
      'Semester 1': {
        appointment: [8, 5, 6, 9, 7],
        document: [4, 3, 6, 5, 2]
      },
      'Semester 2': {
        appointment: [7, 4, 5, 6, 4],
        document: [2, 5, 4, 3, 6]
      },
      'Summer': {
        appointment: [3, 2, 4, 3, 1],
        document: [1, 0, 2, 1, 2]
      }
    };

    const overallRatingData = {
      'Semester 1': [4.5, 4.3, 4.6],
      'Semester 2': [4.1, 3.9, 4.0],
      'Summer': [4.0, 4.1, 3.8]
    };

    const semesterSelect = document.getElementById('semesterSelect');
    semesterSelect.addEventListener('change', function () {
      const selected = this.value;

      // Weekly Users
      weeklyChart.data.datasets[0].data = weeklyUsersData[selected].appointment;
      weeklyChart.data.datasets[1].data = weeklyUsersData[selected].document;
      weeklyChart.update();

      // Overall Rating
      ratingChart.data.datasets[0].data = overallRatingData[selected];
      ratingChart.update();
    });

  </script>
</body>
</html>
