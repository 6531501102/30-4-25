<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ตั้งค่ารหัสภาษาและการแสดงผลบนอุปกรณ์ต่าง ๆ -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard</title>

  <!-- นำเข้า Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- นำเข้า Chart.js สำหรับแสดงกราฟ -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- นำเข้า Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <!-- นำเข้า Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-[#f4f4f4] text-gray-800">
  <div id="app">
    
    <!-- ✅ Topbar ด้านบนของเว็บ -->
    <div class="fixed top-0 left-0 w-full h-16 bg-[#a89ee0] text-white flex items-center justify-between px-6 z-50">
      <div class="flex items-center">
        <!-- ปุ่มแฮมเบอร์เกอร์เพื่อเปิด/ปิด sidebar -->
        <button @click="sidebarOpen = !sidebarOpen" class="text-2xl mr-4 block">
          <i class="bi bi-list"></i>
        </button>
        <!-- โลโก้มหาวิทยาลัย -->
        <img src="https://upload.wikimedia.org/wikipedia/en/7/7e/Logo_of_Mae_Fah_Luang_University.svg" class="h-10 mr-3">
        <strong>REG.MFU</strong>
      </div>

      <!-- การเลือกภาษาและปุ่ม logout -->
      <div class="flex items-center gap-4">
        <div class="flex gap-1">
          <span class="bg-white text-[#7e6ccf] px-2 py-1 rounded font-bold">EN</span>
          /
          <span class="text-white px-2 py-1 rounded">TH</span>
        </div>
        <button class="border border-white px-3 py-1 rounded hover:bg-white hover:text-[#7e6ccf] flex items-center gap-2">
          <i class="bi bi-box-arrow-right"></i> Logout
        </button>
      </div>
    </div>

    <!-- ✅ Sidebar เมนูด้านข้าง -->
    <div :class="[
      'fixed top-16 left-0 h-[calc(100vh-4rem)] w-56 bg-[#7e6ccf] text-white flex flex-col transition-transform duration-300 z-40',
      sidebarOpen ? 'translate-x-0' : '-translate-x-full'
    ]">
      <!-- เมนู Dashboard (กำลังใช้งานอยู่) -->
      <a href="dashboard.html" class="flex items-center px-5 py-3 hover:bg-[#6b5bb5] font-bold shadow-[inset_5px_0_0_white]">
        <i class="bi bi-speedometer2 mr-3"></i> <span class="ml-1">Dashboard</span>
      </a>
      <!-- เมนู Management -->
      <a href="management.html" class="flex items-center px-5 py-3 hover:bg-[#6b5bb5]">
        <i class="bi bi-people-fill mr-3"></i> <span class="ml-1">Management</span>
      </a>
      <!-- เมนู History -->
      <a href="history.html" class="flex items-center px-5 py-3 hover:bg-[#6b5bb5]">
        <i class="bi bi-clock-history mr-3"></i> <span class="ml-1">History</span>
      </a>
    </div>

    <!-- ✅ Main Content ส่วนแสดงข้อมูลหลัก -->
    <div :class="[ 'transition-all duration-300 pt-20 px-6', sidebarOpen ? 'ml-56' : 'ml-0' ]">
      
      <!-- dropdown เลือกภาคการศึกษา -->
      <div class="mb-6">
        <select id="semesterSelect" class="px-3 py-2 rounded border">
          <option>Semester 1</option>
          <option>Semester 2</option>
          <option>Summer</option>
        </select>
      </div>

      <!-- แบ่ง layout ออกเป็น 2 ฝั่ง -->
      <div class="flex flex-col lg:flex-row gap-6">
        
        <!-- 🔵 ซ้าย: แสดงกราฟ -->
        <div class="flex-1">
          <h3 class="font-bold mb-2">NUMBER OF WEEKLY USERS</h3>
          <canvas id="weeklyUsersChart" height="180" class="bg-white p-4 rounded-lg shadow mb-6"></canvas>

          <h3 class="font-bold mb-2">AVERAGE OVERALL RATING</h3>
          <canvas id="overallRatingChart" height="180" class="bg-white p-4 rounded-lg shadow"></canvas>
        </div>

        <!-- 🟢 ขวา: รายชื่อพนักงาน + ลิงก์เรตติ้ง -->
        <div class="w-full lg:w-[300px] bg-white p-4 rounded-lg shadow">
          <div v-for="staff in staffList" class="flex items-center mb-4">
            <img :src="staff.image" class="w-12 h-12 rounded-full mr-4">
            <a :href="staff.link" class="text-black no-underline">
              <strong>{{ staff.name }}</strong><br>
              <i class="bi bi-star-fill text-yellow-400"></i>
              <span class="text-yellow-500 font-bold">{{ staff.rating }}</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ✅ Vue + Chart.js Script -->
  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          sidebarOpen: true, // ตัวแปรควบคุม sidebar เปิด/ปิด
          staffList: [ // รายชื่อพนักงาน + ลิงก์เรตติ้ง
            { name: 'Porntip Panya', rating: 4.8, image: 'https://via.placeholder.com/60', link: 'rating_porntip.html' },
            { name: 'Rattikarn Nanglae', rating: 4.7, image: 'https://via.placeholder.com/60', link: 'rating_rattikarn.html' },
            { name: 'Sanyumporn Chaichormphu', rating: 4.2, image: 'https://via.placeholder.com/60', link: 'rating_sanyumporn.html' },
            { name: 'Tatchamay Whanchisri', rating: 3.9, image: 'https://via.placeholder.com/60', link: 'rating_tatchamay.html' },
            { name: 'Pakpoom Lamprasert', rating: 4.8, image: 'https://via.placeholder.com/60', link: 'rating_pakpoom.html' },
          ],
        }
      },
      mounted() {
        // 🔸 กำหนดข้อมูลกราฟรายสัปดาห์
        const weeklyUsersData = {
          'Semester 1': { appointment: [8, 5, 6, 9, 7], document: [4, 3, 6, 5, 2] },
          'Semester 2': { appointment: [7, 4, 5, 6, 4], document: [2, 5, 4, 3, 6] },
          'Summer':     { appointment: [3, 2, 4, 3, 1], document: [1, 0, 2, 1, 2] }
        };

        // 🔸 กำหนดข้อมูลกราฟเรตติ้ง
        const overallRatingData = {
          'Semester 1': [4.5, 4.3, 4.6],
          'Semester 2': [4.1, 3.9, 4.0],
          'Summer': [4.0, 4.1, 3.8]
        };

        // 🔹 แสดงกราฟ weekly users
        const ctx1 = document.getElementById('weeklyUsersChart').getContext('2d');
        const weeklyChart = new Chart(ctx1, {
          type: 'bar',
          data: {
            labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'],
            datasets: [
              { label: 'Appointment', backgroundColor: 'blue', data: weeklyUsersData['Semester 1'].appointment },
              { label: 'Document Tracking', backgroundColor: 'orange', data: weeklyUsersData['Semester 1'].document }
            ]
          },
          options: { responsive: true, scales: { y: { beginAtZero: true, max: 10 } } }
        });

        // 🔹 แสดงกราฟเรตติ้ง
        const ctx2 = document.getElementById('overallRatingChart').getContext('2d');
        const ratingChart = new Chart(ctx2, {
          type: 'bar',
          data: {
            labels: ['Fast Service', 'Helpful Staff', 'On Time'],
            datasets: [{ label: 'Rating', backgroundColor: ['blue', 'orange', 'red'], data: overallRatingData['Semester 1'] }]
          },
          options: { responsive: true, scales: { y: { min: 0, max: 5 } } }
        });

        // 🔻 เปลี่ยนข้อมูลกราฟเมื่อเปลี่ยนภาคการศึกษา
        document.getElementById('semesterSelect').addEventListener('change', function () {
          const semester = this.value;
          weeklyChart.data.datasets[0].data = weeklyUsersData[semester].appointment;
          weeklyChart.data.datasets[1].data = weeklyUsersData[semester].document;
          weeklyChart.update();

          ratingChart.data.datasets[0].data = overallRatingData[semester];
          ratingChart.update();
        });
      }
    }).mount('#app');
  </script>
</body>
</html>
