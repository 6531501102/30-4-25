
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background-color: #fff; }
    .sidebar {
      width: 220px;
      background-color: #7e6ccf;
      color: white;
      height: 100vh;
      position: fixed;
      top: 60px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      padding: 15px 20px;
      text-decoration: none;
      color: white;
      transition: background 0.3s;
    }
    .nav-item:hover { background-color: #6b5bb5; }
    .nav-item.active {
      background-color: #6b5bb5;
      font-weight: bold;
      box-shadow: inset 5px 0 0 white;
    }
    .nav-item i { margin-right: 10px; }

    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 60px;
      background-color: #a89ee0;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      z-index: 1000;
    }
    .top-left { display: flex; align-items: center; }
    .top-left img { height: 40px; margin-right: 10px; }

    .top-right { display: flex; align-items: center; gap: 20px; }
    .lang-toggle span {
      cursor: pointer;
      padding: 5px 10px;
      border-radius: 5px;
    }
    .lang-toggle .active {
      background-color: white;
      color: #7e6ccf;
      font-weight: bold;
    }
    .logout-button {
      background: transparent;
      border: 1px solid white;
      color: white;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
    }
    .logout-button:hover {
      background-color: white;
      color: #7e6ccf;
    }

    .main-content {
      margin-left: 220px;
      margin-top: 60px;
      padding: 20px;
    }
  </style>
</head>
<body>
<!-- Topbar -->
<div class="topbar">
  <div class="top-left">
    <img src="https://upload.wikimedia.org/wikipedia/en/7/7e/Logo_of_Mae_Fah_Luang_University.svg" alt="Logo" />
    <strong>REG.MFU</strong>
  </div>
  <div class="top-right">
    <div class="lang-toggle">
      <span class="active" id="lang-en">EN</span> /
      <span id="lang-th">TH</span>
    </div>
    <button class="logout-button" onclick="alert('Logging out...')">Logout</button>
  </div>
</div>

<!-- Sidebar -->
<div class="sidebar">
  <a class="nav-item" href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
  <a class="nav-item active" href="management.html"><i class="bi bi-people-fill"></i> Management</a>
  <a class="nav-item" href="history.html"><i class="bi bi-clock-history"></i> History</a>
</div>

<!-- Main Content -->
<div class="main-content" id="app">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold">Management</h1>
    <button @click="showAdd = true" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">Add</button>
  </div>

  <!-- Table Header -->
  <div class="grid grid-cols-4 bg-gray-300 rounded-xl px-3 py-3 font-semibold text-sm mb-3">
    <div>No.</div>
    <div>Name</div>
    <div>Responsibilities</div>
    <div>Status</div>
  </div>

  <!-- Table Rows -->
  <div v-for="(staff, index) in staffList" :key="index" class="grid grid-cols-4 items-center bg-gray-100 rounded-xl px-6 py-3 shadow mb-2">
    <div>{{ index + 1 }}</div>
    <div><strong>{{ staff.name }}</strong></div>
    <div>{{ staff.role }}</div>
    <div class="flex gap-2 justify-center">
      <button @click="removeStaff(index)" class="bg-red-400 text-white px-3 py-1 rounded hover:bg-red-500 text-sm">Disable</button>
      <button @click="editStaff(index)" class="bg-yellow-400 text-white px-3 py-1 rounded hover:bg-yellow-500 text-sm">Edit</button>
    </div>
  </div>

  <!-- Add Modal -->
  <div v-if="showAdd" class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center">
    <div class="bg-white p-6 rounded-xl w-80 shadow-lg">
      <h2 class="text-xl font-bold mb-4">Add Staff</h2>
      <input v-model="newStaff.name" type="text" placeholder="Name" class="w-full mb-3 p-2 border rounded" />
      <select v-model="newStaff.role" class="w-full mb-3 p-2 border rounded">
        <option disabled value="">Select Responsibility</option>
        <option>Course registration</option>
        <option>Tuition fee deferment</option>
        <option>University activity</option>
        <option>Student assistant</option>
      </select>
      <div class="flex justify-end gap-2">
        <button @click="showAdd = false" class="px-4 py-1 rounded bg-gray-300 hover:bg-gray-400">Cancel</button>
        <button @click="addStaff" class="px-4 py-1 rounded bg-green-500 text-white hover:bg-green-600">Save</button>
      </div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div v-if="showEdit" class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center">
    <div class="bg-white p-6 rounded-xl w-80 shadow-lg">
      <h2 class="text-xl font-bold mb-4">Edit Staff</h2>
      <input v-model="editData.name" type="text" class="w-full mb-3 p-2 border rounded" />
      <select v-model="editData.role" class="w-full mb-3 p-2 border rounded">
        <option>Course registration</option>
        <option>Tuition fee deferment</option>
        <option>University activity</option>
        <option>Student assistant</option>
      </select>
      <div class="flex justify-end gap-2">
        <button @click="showEdit = false" class="px-4 py-1 rounded bg-gray-300 hover:bg-gray-400">Cancel</button>
        <button @click="saveEdit" class="px-4 py-1 rounded bg-yellow-500 text-white hover:bg-yellow-600">Save</button>
      </div>
    </div>
  </div>
</div>

<script>
  const { createApp } = Vue;
  createApp({
    data() {
      return {
        staffList: [
          { name: 'Staff A', role: 'Course registration' },
          { name: 'Staff B', role: 'Tuition fee deferment' },
          { name: 'Staff C', role: 'University activity' },
          { name: 'Staff D', role: 'Student assistant' },
          { name: 'Staff E', role: 'Course registration' }
        ],
        newStaff: { name: '', role: '' },
        showAdd: false,
        showEdit: false,
        editIndex: null,
        editData: { name: '', role: '' }
      };
    },
    methods: {
      addStaff() {
        if (this.newStaff.name && this.newStaff.role) {
          this.staffList.push({ ...this.newStaff });
          this.newStaff = { name: '', role: '' };
          this.showAdd = false;
        }
      },
      removeStaff(index) {
        this.staffList.splice(index, 1);
      },
      editStaff(index) {
        this.editIndex = index;
        this.editData = { ...this.staffList[index] };
        this.showEdit = true;
      },
      saveEdit() {
        if (this.editData.name && this.editData.role) {
          this.staffList.splice(this.editIndex, 1, { ...this.editData });
          this.showEdit = false;
        }
      }
    }
  }).mount('#app');
</script>
</body>
</html>
