<!DOCTYPE html>
<html lang="en">
<head>
  <!-- กำหนด charset และ responsive viewport -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>History</title>

  <!-- เรียกใช้ Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- เรียกใช้ Vue 3 แบบ Global -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <!-- ใช้ Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body class="bg-white text-gray-800">

<div id="app"> <!-- Vue mount point -->

  <!-- ✅ Topbar ส่วนบนของเว็บไซต์ -->
  <div class="fixed top-0 left-0 w-full h-16 bg-[#a89ee0] text-white flex items-center justify-between px-6 z-50">
    <div class="flex items-center">
      <!-- ปุ่มแฮมเบอร์เกอร์เปิดปิด Sidebar -->
      <button @click="sidebarOpen = !sidebarOpen" class="text-2xl mr-4 block">
        <i class="bi bi-list"></i>
      </button>
      <!-- โลโก้มหาวิทยาลัย -->
      <img src="https://upload.wikimedia.org/wikipedia/en/7/7e/Logo_of_Mae_Fah_Luang_University.svg" alt="logo" class="h-10 mr-3">
      <strong>REG.MFU</strong>
    </div>

    <div class="flex items-center gap-4">
      <!-- สลับภาษา -->
      <div class="flex gap-1">
        <span class="cursor-pointer bg-white text-[#7e6ccf] px-2 py-1 rounded font-bold">EN</span> /
        <span class="cursor-pointer text-white px-2 py-1 rounded">TH</span>
      </div>
      <!-- ปุ่ม Logout -->
      <button class="border border-white px-3 py-1 rounded hover:bg-white hover:text-[#7e6ccf] transition flex items-center gap-2">
        <i class="bi bi-box-arrow-right"></i> Logout
      </button>
    </div>
  </div>

  <!-- ✅ Sidebar ด้านข้าง -->
  <div :class="[
    'fixed top-16 left-0 h-[calc(100vh-4rem)] w-56 bg-[#7e6ccf] text-white flex flex-col transition-transform duration-300 z-40',
    sidebarOpen ? 'translate-x-0' : '-translate-x-56'
  ]">
    <!-- ลิงก์ Dashboard -->
    <a href="dashboard.html" class="flex items-center px-5 py-3 hover:bg-[#6b5bb5]">
      <i class="bi bi-speedometer2 mr-3"></i> <span class="ml-1">Dashboard</span>
    </a>
    <!-- ลิงก์ Management -->
    <a href="management.html" class="flex items-center px-5 py-3 hover:bg-[#6b5bb5]">
      <i class="bi bi-people-fill mr-3"></i> <span class="ml-1">Management</span>
    </a>
    <!-- ลิงก์ History (หน้านี้) -->
    <a href="history.html" class="flex items-center px-5 py-3 font-bold bg-[#6b5bb5] shadow-[inset_5px_0_0_white]">
      <i class="bi bi-clock-history mr-3"></i> <span class="ml-1">History</span>
    </a>
  </div>

  <!-- ✅ Main Content -->
  <div :class="[
    'mt-20 p-6 transition-all duration-300',
    sidebarOpen ? 'ml-56' : 'ml-0'
  ]">

    <!-- รายชื่อพนักงาน -->
    <div v-if="page === 'list'">
      <h1 class="text-3xl font-bold mb-6">History</h1>
      <div class="grid grid-cols-2 md:grid-cols-3 gap-6">
        <!-- รายการการ์ดพนักงาน -->
        <div v-for="(staff, index) in staffList" :key="index"
             @click="goToDetail(staff)"
             class="cursor-pointer bg-[#f5f5f5] hover:bg-gray-200 rounded-xl p-4 flex flex-col items-center shadow">
          <img :src="staff.image" alt="" class="w-20 h-20 rounded-full mb-2" />
          <div class="text-center font-semibold">{{ staff.name }}</div>
        </div>
      </div>
    </div>

    <!-- หน้าแสดงรายละเอียดพนักงาน -->
    <div v-else>
      <div class="flex items-center justify-between mb-4">
        <button @click="page = 'list'" class="text-sm text-[#7e6ccf] hover:underline">&larr; Back</button>
        <input type="week" v-model="selectedWeek" class="border rounded px-3 py-1" />
      </div>

      <!-- แถบเลือกแท็บ -->
      <div class="flex gap-4 mb-4">
        <button @click="tab = 'appointment'" :class="tab === 'appointment' ? activeTabClass : inactiveTabClass">Appointment</button>
        <button @click="tab = 'document'" :class="tab === 'document' ? activeTabClass : inactiveTabClass">Document Tracking</button>
      </div>

      <!-- ตาราง Appointment -->
      <div v-if="tab === 'appointment'">
        <table class="w-full text-left shadow rounded overflow-hidden">
          <thead class="bg-[#4D55CC] text-white">
            <tr>
              <th class="p-2">No.</th>
              <th class="p-2">ID</th>
              <th class="p-2">Date & Time</th>
              <th class="p-2">Topic</th>
              <th class="p-2">Status</th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="(row, index) in appointmentData" :key="index" class="bg-white">
              <td class="p-2">{{ index + 1 }}</td>
              <td class="p-2">{{ row.id }}</td>
              <td class="p-2">{{ row.datetime }}</td>
              <td class="p-2">{{ row.topic }}</td>
              <td class="p-2" :class="row.status === 'Approve' ? 'text-green-600' : 'text-red-500'">{{ row.status }}</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- ตาราง Document -->
      <div v-else>
        <table class="w-full text-left shadow rounded overflow-hidden">
          <thead class="bg-[#B5A8D5] text-white">
            <tr>
              <th class="p-2">No.</th>
              <th class="p-2">ID</th>
              <th class="p-2">Date</th>
              <th class="p-2">Topic</th>
              <th class="p-2">Status</th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="(row, index) in documentData" :key="index" class="bg-white">
              <td class="p-2">{{ index + 1 }}</td>
              <td class="p-2">{{ row.id }}</td>
              <td class="p-2">{{ row.date }}</td>
              <td class="p-2">{{ row.topic }}</td>
              <td class="p-2" :class="row.status === 'Approved' ? 'text-green-600' : 'text-red-500'">{{ row.status }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- ✅ Vue App Script -->
<script>
const { createApp } = Vue;
createApp({
  data() {
    return {
      sidebarOpen: true, // สำหรับเปิด/ปิด sidebar
      page: 'list', // 'list' = แสดงรายชื่อพนักงาน, 'detail' = แสดงรายละเอียด
      tab: 'appointment', // แท็บที่เลือก
      selectedWeek: '',

      // ข้อมูลรายชื่อพนักงาน
      staffList: [
        { name: 'Staff A', image: 'https://via.placeholder.com/100' },
        { name: 'Staff B', image: 'https://via.placeholder.com/100' },
        { name: 'Staff C', image: 'https://via.placeholder.com/100' },
      ],

      // ข้อมูลการนัดหมาย
      appointmentData: [
        { id: 'A001', datetime: '21/03/25 - 08:00 AM', topic: 'Course registration', status: 'Reject' },
        { id: 'A002', datetime: '21/03/25 - 09:00 AM', topic: 'Course registration', status: 'Approve' }
      ],

      // ข้อมูลเอกสาร
      documentData: [
        { id: 'A001', date: '21 Apr 2025', topic: 'Course registration; หัวข้อย่อย', status: 'Approved' },
        { id: 'A002', date: '21 Apr 2025', topic: 'Course registration; หัวข้อย่อย', status: 'Reject' }
      ]
    }
  },
  methods: {
    // เมื่อคลิกพนักงาน จะเปลี่ยนไปหน้ารายละเอียด
    goToDetail(staff) {
      this.page = 'detail';
    }
  },
  computed: {
    // class สำหรับปุ่มแท็บ
    activeTabClass() {
      return 'bg-[#7e6ccf] text-white px-4 py-2 rounded font-semibold';
    },
    inactiveTabClass() {
      return 'bg-gray-200 text-black px-4 py-2 rounded hover:bg-gray-300';
    }
  }
}).mount('#app');
</script>

</body>
</html>
